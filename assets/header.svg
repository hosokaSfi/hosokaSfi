<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">HOPE的 ★ 観測ページ</title>
  <desc id="desc">夜空と月とお茶をモチーフにした hosokaSfi のプロフィールヘッダー</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a18"/>
      <stop offset="0.55" stop-color="#11173a"/>
      <stop offset="1" stop-color="#2b1b4f"/>
    </linearGradient>
    <linearGradient id="horizonGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbbcff"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescent">
      <circle cx="1040" cy="104" r="40" fill="#fff"/>
      <circle cx="1058" cy="92" r="36" fill="#000"/>
    </mask>
    <clipPath id="card"><rect width="1200" height="400" rx="20"/></clipPath>
    <clipPath id="typing">
      <rect x="72" y="296" width="0" height="34">
        <animate attributeName="width" values="0;12;24;36;48;60;72;84;96;108;120;132;144;156;168;180;192;204;216;228;240;252;264;276;288;300;312;324;336;348;360;372;384;396;408;420;432;444;456;468;480;492;504" keyTimes="0.0000;0.0238;0.0476;0.0714;0.0952;0.1190;0.1429;0.1667;0.1905;0.2143;0.2381;0.2619;0.2857;0.3095;0.3333;0.3571;0.3810;0.4048;0.4286;0.4524;0.4762;0.5000;0.5238;0.5476;0.5714;0.5952;0.6190;0.6429;0.6667;0.6905;0.7143;0.7381;0.7619;0.7857;0.8095;0.8333;0.8571;0.8810;0.9048;0.9286;0.9524;0.9762;1.0000" calcMode="discrete" dur="2.6s" begin="0.8s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    .tw1,.tw2,.tw3,.tw4{fill:#fff;animation:twinkle ease-in-out infinite}
    .tw1{animation-duration:2.8s} .tw2{animation-duration:3.6s}
    .tw3{animation-duration:4.4s} .tw4{animation-duration:5.2s}
    @keyframes twinkle{0%,100%{opacity:.9}50%{opacity:.15}}
    .shoot{animation:shoot 9s linear infinite;opacity:0}
    @keyframes shoot{0%{transform:translate(0,0);opacity:0}2%{opacity:1}12%{transform:translate(520px,170px);opacity:0}100%{transform:translate(520px,170px);opacity:0}}
    .steam{fill:none;stroke:#e9e4ff;stroke-width:2.4;stroke-linecap:round;opacity:0;animation:steam 3.6s ease-in-out infinite}
    .s2{animation-delay:1.2s} .s3{animation-delay:2.4s}
    @keyframes steam{0%{transform:translateY(8px);opacity:0}35%{opacity:.75}100%{transform:translateY(-26px);opacity:0}}
    .star{fill:#ffd36e;animation:glint 3s ease-in-out infinite}
    @keyframes glint{0%,100%{fill:#ffd36e}50%{fill:#fff4cf}}
    .ja{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",sans-serif}
    .mono{font-family:"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.steam{opacity:.5}}
  </style>

